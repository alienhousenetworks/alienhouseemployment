{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">Assign Manager</h4>
                </div>
                <div class="card-body">
                    <h5 class="card-title mb-4">Employee: {{ object }}</h5>
                    
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="id_manager" class="form-label">Select Manager</label>
                            {{ form.manager }} <!-- Renders the dropdown -->
                        </div>
                        <button type="submit" class="btn btn-success">Save Assignment</button>
                        <a href="{% url 'organization:employee-list' %}" class="btn btn-secondary">Cancel</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
