<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Employee Management Portal</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f9f9f9; }
        header { background: #333; color: #fff; padding: 10px; text-align: center; }
        nav a { margin: 0 10px; color: #fff; text-decoration: none; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        th { background: #eee; }
        .btn { padding: 6px 12px; margin: 5px; border: none; cursor: pointer; }
        .btn-primary { background: #007bff; color: #fff; }
        .btn-danger { background: #dc3545; color: #fff; }
        .message { padding: 10px; background: #d4edda; color: #155724; margin-bottom: 20px; border-radius: 4px; }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
<header>
    <h1>Employee Management Portal</h1>
    <nav>
        <a href="{% url 'contract-test' %}">Contract Actions</a>
        <a href="{% url 'employee-list' %}">Employee List</a>
        <a href="{% url 'logout' %}">Logout</a>
    </nav>
</header>
<main>
    {% block content %}{% endblock %}
</main>
</body>
</html>
